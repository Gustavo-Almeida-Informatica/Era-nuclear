<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b0f17" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Bomb Outer Metallic Gradients -->
    <linearGradient id="bombOuterBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#737c87"/>
      <stop offset="15%" stop-color="#9aa3af"/>
      <stop offset="45%" stop-color="#555c66"/>
      <stop offset="80%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#181c22"/>
    </linearGradient>

    <linearGradient id="noseConeGrad" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#646d7a"/>
      <stop offset="35%" stop-color="#3b424d"/>
      <stop offset="70%" stop-color="#20252b"/>
      <stop offset="100%" stop-color="#0d1014"/>
    </linearGradient>

    <linearGradient id="tailFinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a6370"/>
      <stop offset="50%" stop-color="#3d444f"/>
      <stop offset="100%" stop-color="#22272e"/>
    </linearGradient>

    <linearGradient id="tailFinTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76808e"/>
      <stop offset="100%" stop-color="#474f5c"/>
    </linearGradient>

    <!-- Cutaway Cavity & Barrel Gradients -->
    <linearGradient id="cutawayBore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="50%" stop-color="#252b34"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>

    <linearGradient id="barrelWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#474f5b"/>
      <stop offset="50%" stop-color="#636d7a"/>
      <stop offset="100%" stop-color="#2b313a"/>
    </linearGradient>

    <!-- Propellant Explosives -->
    <linearGradient id="propellantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Glowing Uranium-235 Components -->
    <linearGradient id="u235Slug" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <radialGradient id="u235Radial" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Red Arrow Gradient -->
    <linearGradient id="redArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black Canvas -->
  <rect width="840" height="500" fill="#000000"/>
  <rect width="840" height="500" fill="url(#bgVignette)"/>

  <!-- ================= TOP TITLES ================= -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="420" y="46" fill="#ffffff" font-size="32" font-weight="800" letter-spacing="0.5">Little Boy</text>
    <text x="420" y="75" fill="#ffffff" font-size="16" font-weight="500" letter-spacing="0.3">Bomba con mecanismo de pistola</text>
  </g>

  <!-- ================= 3D BOMB ASSEMBLY ================= -->
  <g id="bombIllustration" transform="translate(10, 15)">

    <!-- TAIL FIN BOX (Box tail aerodynamic structure) -->
    <!-- Rear square opening (depth perspective) -->
    <polygon points="120,195 190,195 190,305 120,305" fill="#323842" stroke="#525b68" stroke-width="2"/>
    <polygon points="120,195 152,168 222,168 190,195" fill="url(#tailFinTop)" stroke="#677282" stroke-width="1.5"/>
    <polygon points="190,195 222,168 222,278 190,305" fill="#20242b" stroke="#3d444f" stroke-width="1.5"/>

    <!-- Hollow box interior -->
    <polygon points="132,204 178,204 178,296 132,296" fill="#111418" stroke="#252a32" stroke-width="1.5"/>
    <!-- Diagonal stabilizing cruciform struts inside box fin -->
    <line x1="132" y1="204" x2="178" y2="296" stroke="#3b434e" stroke-width="2.5"/>
    <line x1="178" y1="204" x2="132" y2="296" stroke="#3b434e" stroke-width="2.5"/>

    <!-- TAIL SHROUD / CONE CONNECTION -->
    <polygon points="190,225 250,230 250,270 190,275" fill="url(#tailFinGrad)" stroke="#454c57" stroke-width="1.5"/>
    <polygon points="250,230 295,215 295,285 250,270" fill="url(#tailFinGrad)" stroke="#525b68" stroke-width="1.5"/>

    <!-- MAIN CYLINDRICAL BOMB CASING -->
    <!-- Upper Hull Edge (Shaded 3D cylinder curve) -->
    <path d="M 295,215 
             C 350,202 480,196 645,220 
             L 645,232 
             C 480,210 350,216 295,228 Z" 
          fill="url(#bombOuterBody)"/>
    <line x1="295" y1="216" x2="645" y2="221" stroke="#a6b0be" stroke-width="1.8" opacity="0.8"/>

    <!-- Lower Hull Edge (Underside shadow) -->
    <path d="M 295,285 
             C 360,305 500,314 655,296 
             L 655,308 
             C 500,326 360,317 295,296 Z" 
          fill="#171b20"/>

    <!-- CUTAWAY RECESS (Exposing internal artillery mechanism) -->
    <path d="M 295,228 
             C 350,215 480,212 645,226 
             C 665,236 672,256 672,272 
             C 672,290 660,304 645,307 
             C 480,322 350,314 295,296 Z" 
          fill="url(#cutawayBore)" stroke="#3f4752" stroke-width="2"/>

    <!-- Metal casing wall thickness / beveled cut rim -->
    <path d="M 295,228 C 350,215 480,212 645,226" fill="none" stroke="#9da7b5" stroke-width="2.5"/>
    <path d="M 295,296 C 350,314 480,322 645,307" fill="none" stroke="#252a32" stroke-width="2"/>

    <!-- ARTILLERY CANNON BORE (Smooth bore barrel) -->
    <rect x="330" y="244" width="300" height="46" rx="4" fill="#0f1318" stroke="url(#barrelWall)" stroke-width="2"/>
    <line x1="335" y1="247" x2="625" y2="247" stroke="#2a313b" stroke-width="1"/>
    <line x1="335" y1="287" x2="625" y2="287" stroke="#1d2228" stroke-width="1"/>

    <!-- 1. EXPLOSIVOS CONVENCIONALES (Rear Propellant Charge) -->
    <g id="explosivosConvencionales">
      <rect x="338" y="250" width="40" height="34" rx="4" fill="url(#propellantGrad)" stroke="#cbd5e1" stroke-width="1.8"/>
      <!-- Breech block & detonator connection -->
      <rect x="330" y="255" width="8" height="24" rx="2" fill="#64748b" stroke="#475569" stroke-width="1.2"/>
      <line x1="338" y1="258" x2="333" y2="258" stroke="#94a3b8" stroke-width="2"/>
      <line x1="338" y1="274" x2="333" y2="274" stroke="#94a3b8" stroke-width="2"/>
    </g>

    <!-- 2. CILINDRO DE URANIO 235 (Moving Hollow Projectile) -->
    <g id="cilindroUranio235">
      <!-- Outer halo / energetic glow -->
      <rect x="398" y="249" width="62" height="36" rx="9" fill="#f59e0b" opacity="0.3" filter="url(#softGlow)"/>
      <!-- Main golden slug -->
      <rect x="400" y="251" width="58" height="32" rx="8" fill="url(#u235Radial)" stroke="#fef08a" stroke-width="2"/>
      <!-- Specular reflection highlight on curvature -->
      <line x1="408" y1="256" x2="450" y2="256" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <!-- Hollow cavity indicator (inner cylinder) -->
      <rect x="410" y="260" width="38" height="14" rx="3" fill="#92400e" opacity="0.35"/>
    </g>

    <!-- RED PROPULSION ARROW (Direction of Movement) -->
    <g id="vectorDireccion" transform="translate(475, 267)">
      <!-- Arrow shaft -->
      <line x1="0" y1="0" x2="72" y2="0" stroke="url(#redArrow)" stroke-width="6.5" stroke-linecap="round"/>
      <!-- Arrow head with 3D polygon -->
      <polygon points="68,-8 86,0 68,8" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
    </g>

    <!-- 3. OBJETIVO DE URANIO 235 (Target Insert in Nose) -->
    <g id="objetivoUranio235">
      <!-- Glow -->
      <rect x="588" y="248" width="50" height="38" rx="8" fill="#f59e0b" opacity="0.35" filter="url(#softGlow)"/>
      <!-- Target slug -->
      <rect x="590" y="250" width="46" height="34" rx="7" fill="url(#u235Radial)" stroke="#fef08a" stroke-width="2"/>
      <line x1="597" y1="255" x2="628" y2="255" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <!-- Tungsten carbide tamper envelope / neutron reflector -->
      <path d="M 584,242 L 642,242 L 642,292 L 584,292" fill="none" stroke="#717a87" stroke-width="2" stroke-dasharray="3,3"/>
    </g>

    <!-- NOSE CAP (Rounded Front Nose) -->
    <path d="M 645,226 
             C 680,234 715,250 715,269 
             C 715,288 680,301 645,307 
             Z" 
          fill="url(#noseConeGrad)" stroke="#39424e" stroke-width="2.2"/>
    <!-- Specular highlight arc on nose cap -->
    <path d="M 650,237 C 678,245 700,256 706,266" fill="none" stroke="#8793a3" stroke-width="2.5" opacity="0.65" stroke-linecap="round"/>

  </g>

  <!-- ================= ANNOTATION CALLOUTS ================= -->
  <!-- Callout Lines (White lines with anchor dots) -->
  <g stroke="#ffffff" stroke-width="1.4" fill="none">
    <!-- Callout 1: Explosivos convencionales -->
    <line x1="368" y1="265" x2="368" y2="175"/>
    
    <!-- Callout 2: Cilindro de uranio 235 -->
    <line x1="439" y1="265" x2="439" y2="160"/>
    
    <!-- Callout 3: Objetivo de uranio 235 -->
    <line x1="623" y1="265" x2="623" y2="190"/>
  </g>

  <!-- Anchor Dots -->
  <g fill="#ffffff">
    <circle cx="368" cy="265" r="3.5"/>
    <circle cx="439" cy="265" r="3.5"/>
    <circle cx="623" cy="265" r="3.5"/>
  </g>

  <!-- Callout Text Labels -->
  <g fill="#ffffff" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- 1. Explosivos convencionales -->
    <text x="368" y="148" text-anchor="middle" font-size="14" font-weight="700">Explosivos</text>
    <text x="368" y="166" text-anchor="middle" font-size="14" font-weight="700">convencionales</text>

    <!-- 2. Cilindro de uranio 235 choca contra el objetivo y desatan la fisión -->
    <text x="442" y="112" text-anchor="start" font-size="15" font-weight="700">Cilindro de uranio 235</text>
    <text x="442" y="131" text-anchor="start" font-size="13.5" font-weight="400" fill="#f1f5f9">choca contra el objetivo y</text>
    <text x="442" y="149" text-anchor="start" font-size="13.5" font-weight="400" fill="#f1f5f9">desatan la fisión</text>

    <!-- 3. Objetivo de uranio 235 -->
    <text x="623" y="170" text-anchor="middle" font-size="14.5" font-weight="700">Objetivo de</text>
    <text x="623" y="188" text-anchor="middle" font-size="14.5" font-weight="700">uranio 235</text>
  </g>

  <!-- ================= TECHNICAL DIMENSIONS ================= -->
  <!-- 70 cm Bracket (Diameter of Tail Box) -->
  <g stroke="#ffffff" stroke-width="1.6" fill="none">
    <line x1="110" y1="210" x2="120" y2="210"/>
    <line x1="110" y1="210" x2="110" y2="320"/>
    <line x1="110" y1="320" x2="120" y2="320"/>
  </g>
  <text x="96" y="270" fill="#ffffff" font-family="'Inter', sans-serif" font-size="15" font-weight="700" text-anchor="end">70 cm</text>

  <!-- 3 metros Bracket (Overall Length: 3m) -->
  <g stroke="#ffffff" stroke-width="1.6" fill="none">
    <!-- Left end cap -->
    <line x1="130" y1="358" x2="130" y2="368"/>
    <!-- Left line -->
    <line x1="130" y1="363" x2="360" y2="363"/>
    <!-- Right line -->
    <line x1="450" y1="363" x2="725" y2="363"/>
    <!-- Right end cap -->
    <line x1="725" y1="358" x2="725" y2="368"/>
  </g>
  <text x="405" y="368" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle">3 metros</text>

  <!-- Peso: 4.400 kg -->
  <text x="130" y="415" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="start">Peso: 4.400 kg</text>

  <!-- Bottom Left Footnote -->
  <text x="50" y="468" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-style="italic" text-anchor="start">Modelo simplificado, no a escala</text>
</svg>
